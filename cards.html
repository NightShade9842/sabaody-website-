<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card Database | SABAODY BOT</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav>
        <div class="logo">⚓ SABAODY BOT</div>
        <ul>
            <li><a href="/profile.html">Profile</a></li>
            <li><a href="/cards.html" class="active">Cards</a></li>
            <li><a href="/marketplace.html">Market</a></li>
            <li><a href="/store.html">Store</a></li>
            <li><a href="/pokemon.html">Pokémon</a></li>
            <li><a href="/leaderboard.html">Leaderboard</a></li>
        </ul>
    </nav>

    <div class="container">
        <h2 style="color:var(--gold);">🃏 Card Database</h2>
        <input type="text" class="search-box" id="searchInput" placeholder="Search by card name..." onkeyup="filterCards()">
        <div class="filters">
            <select id="rarityFilter" onchange="filterCards()">
                <option value="">All Tiers</option>
                <option value="t1">T1</option>
                <option value="t2">T2</option>
                <option value="t3">T3</option>
                <option value="t4">T4</option>
                <option value="t5">T5</option>
                <option value="t6">T6</option>
                <option value="tx">TX</option>
            </select>
            <select id="sortBy" onchange="filterCards()">
                <option value="name">Name A-Z</option>
                <option value="attack">Highest ATK</option>
                <option value="defense">Highest DEF</option>
            </select>
        </div>
        <div class="card-grid" id="cardsContainer"></div>
    </div>

    <script src="js/main.js"></script>
    <script src="js/cards.js"></script>
</body>
</html>
