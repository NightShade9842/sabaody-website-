<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leaderboard | SABAODY BOT</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav>
        <div class="logo">⚓ SABAODY BOT</div>
        <ul>
            <li><a href="/profile.html">Profile</a></li>
            <li><a href="/cards.html">Cards</a></li>
            <li><a href="/marketplace.html">Market</a></li>
            <li><a href="/store.html">Store</a></li>
            <li><a href="/pokemon.html">Pokémon</a></li>
            <li><a href="/leaderboard.html" class="active">Leaderboard</a></li>
        </ul>
    </nav>

    <div class="container">
        <h2 style="color:var(--gold);">🏆 Grand Line Rankings</h2>
        <div class="tabs">
            <button class="tab-btn active" onclick="loadLB('level')">⭐ Levels</button>
            <button class="tab-btn" onclick="loadLB('richest')">💰 Richest</button>
            <button class="tab-btn" onclick="loadLB('legendary')">🃏 Legendary Cards</button>
            <button class="tab-btn" onclick="loadLB('guild')">⚔️ Guilds</button>
        </div>
        <div id="lbContent"></div>
    </div>

    <script src="js/main.js"></script>
    <script>
        async function loadLB(type) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            event.target.classList.add('active');
            const content = document.getElementById('lbContent');
            content.innerHTML = '<div class="loading"><div class="spinner"></div>Loading...</div>';

            try {
                const res = await fetch(`/api/leaderboard?type=${type}`);
                const data = await res.json();

                if (data.error) {
                    content.innerHTML = `<p style="color:var(--danger);">${data.message || data.error}</p>`;
                    return;
                }
                if (!Array.isArray(data) || !data.length) {
                    content.innerHTML = '<p style="color:var(--text2);">No data yet.</p>';
                    return;
                }

                let html = '<table><thead><tr>';
                if (type === 'level') html += '<th>Rank</th><th>Pirate</th><th>Level</th><th>XP</th>';
                else if (type === 'richest') html += '<th>Rank</th><th>Pirate</th><th>Wallet</th><th>Bank</th><th>Total</th>';
                else if (type === 'legendary') html += '<th>Rank</th><th>Pirate</th><th>Legendary Cards</th>';
                else if (type === 'guild') html += '<th>Rank</th><th>Guild</th><th>Treasury</th><th>Members</th>';
                html += '</tr></thead><tbody>';

                data.forEach((r, i) => {
                    const cls = i < 3 ? `rank-${i + 1}` : '';
                    html += `<tr class="${cls}"><td>#${i + 1}</td>`;
                    if (type === 'level') html += `<td>${r.pirate_name}</td><td>${r.level}</td><td>${formatNumber(r.xp)}</td>`;
                    else if (type === 'richest') html += `<td>${r.pirate_name}</td><td>${formatNumber(r.beli)}฿</td><td>${formatNumber(r.bank)}฿</td><td>${formatNumber(r.total)}฿</td>`;
                    else if (type === 'legendary') html += `<td>${r.pirate_name}</td><td>${r.count}</td>`;
                    else if (type === 'guild') html += `<td>${r.name}</td><td>${formatNumber(r.treasury)}฿</td><td>${r.members}</td>`;
                    html += '</tr>';
                });

                content.innerHTML = html + '</tbody></table>';
            } catch (e) {
                content.innerHTML = `<p style="color:var(--danger);">Failed to load. ${e.message}</p>`;
            }
        }

        loadLB('level');
    </script>
</body>
</html>
