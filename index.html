<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SABAODY BOT – Login</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            background: var(--bg);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .login-box {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 3rem 2rem;
            width: 100%;
            max-width: 400px;
            text-align: center;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
        }
        .login-box h1 {
            color: var(--gold);
            margin-bottom: 0.5rem;
        }
        .login-box p {
            color: var(--text2);
            margin-bottom: 2rem;
        }
        .login-box input {
            width: 100%;
            padding: 0.8rem 1rem;
            background: var(--surface2);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text);
            font-size: 1rem;
            margin-bottom: 1.5rem;
        }
        .login-box .btn {
            width: 100%;
        }
    </style>
</head>
<body>
    <div class="login-box">
        <h1>⚓ SABAODY BOT</h1>
        <p>Enter your WhatsApp number to continue</p>
        <input type="text" id="phoneInput" placeholder="e.g. 233560806367">
        <button class="btn" onclick="login()">🚀 Enter Grand Line</button>
        <div id="errorMsg" style="margin-top:1rem; color:var(--danger);"></div>
    </div>

    <script>
        function getUserId(raw) {
            let id = raw.trim();
            if (!id) return null;
            if (!id.includes('@')) id += '@s.whatsapp.net';
            return id;
        }

        async function login() {
            const raw = document.getElementById('phoneInput').value;
            const userId = getUserId(raw);
            if (!userId) {
                document.getElementById('errorMsg').textContent = 'Please enter a valid WhatsApp number.';
                return;
            }

            // Check if user exists
            try {
                const res = await fetch(`/api/profile?id=${encodeURIComponent(userId)}`);
                const data = await res.json();
                if (res.status === 404 || data.error) {
                    document.getElementById('errorMsg').textContent = 'Number not registered. Use the bot to register first (.register <name>)';
                    return;
                }
                // Save to localStorage and redirect
                localStorage.setItem('sabaody_user', userId);
                window.location.href = '/profile.html';
            } catch (e) {
                document.getElementById('errorMsg').textContent = 'Connection error. Try again.';
            }
        }
    </script>
</body>
</html>
