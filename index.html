<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SABAODY BOT – Login</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="login-box">
        <h1>⚓ SABAODY BOT</h1>
        <p>Enter your WhatsApp number to continue</p>
        <input type="text" id="phoneInput" placeholder="e.g. 233560806367">
        <button class="btn" onclick="login()">🚀 Enter Grand Line</button>
        <div id="errorMsg" style="margin-top:1rem; color:var(--danger);"></div>
    </div>
    <script src="js/main.js"></script>
    <script>
        async function login() {
            const raw = document.getElementById('phoneInput').value;
            const userId = getUserId(raw);
            if (!userId) {
                document.getElementById('errorMsg').textContent = 'Enter a valid WhatsApp number.';
                return;
            }
            try {
                const res = await fetch(`/api/profile?id=${encodeURIComponent(userId)}`);
                const data = await res.json();
                if (res.status === 404 || data.error) {
                    document.getElementById('errorMsg').textContent = 'Number not registered. Use the bot to register first (.register <name>)';
                    return;
                }
                localStorage.setItem('sabaody_user', userId);
                window.location.href = '/profile.html';
            } catch (e) {
                document.getElementById('errorMsg').textContent = 'Connection error. Try again.';
            }
        }
    </script>
</body>
</html>
