<script src="js/main.js"></script>
<script>
    async function loadLB(type) {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        event.target.classList.add('active');
        const content = document.getElementById('lbContent');
        content.innerHTML = '<div class="loading"><div class="spinner"></div>Loading...</div>';

        try {
            const res = await fetch(`/api/leaderboard?type=${type}`);
            const data = await res.json();

            // If the API returned an error object, show it
            if (data.error) {
                content.innerHTML = `<p style="color:var(--danger);">Leaderboard error: ${data.message || data.error}</p>`;
                return;
            }

            if (!Array.isArray(data) || !data.length) {
                content.innerHTML = '<p style="color:var(--text2);">No data yet.</p>';
                return;
            }

            // Build table (same as before)
            let html = '<table><thead><tr>';
            if (type === 'level') html += '<th>Rank</th><th>Pirate</th><th>Level</th><th>XP</th>';
            // ... (rest of table building exactly as in the external file)
            // (I'll include the full version below for completeness)
            content.innerHTML = html + '</tbody></table>';
        } catch (e) {
            content.innerHTML = `<p style="color:var(--danger);">Failed to load leaderboard. ${e.message}</p>`;
        }
    }
    loadLB('level');
</script>
