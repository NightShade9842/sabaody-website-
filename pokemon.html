<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokémon | SABAODY BOT</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav>
        <div class="logo">⚓ SABAODY BOT</div>
        <ul>
            <li><a href="/profile.html">Profile</a></li>
            <li><a href="/cards.html">Cards</a></li>
            <li><a href="/marketplace.html">Market</a></li>
            <li><a href="/store.html">Store</a></li>
            <li><a href="/pokemon.html" class="active">Pokémon</a></li>
            <li><a href="/leaderboard.html">Leaderboard</a></li>
        </ul>
    </nav>

    <div class="container">
        <h2 style="color:var(--gold);">🐾 Grand Line Pokémon</h2>
        <input type="text" class="search-box" id="pokeSearch" placeholder="Search by name or owner..." onkeyup="filterPokemon()">
        <div class="filters">
            <select id="rarityFilter" onchange="filterPokemon()">
                <option value="">All Rarities</option>
                <option value="Common">Common</option>
                <option value="Uncommon">Uncommon</option>
                <option value="Rare">Rare</option>
                <option value="Epic">Epic</option>
                <option value="Legendary">Legendary</option>
            </select>
        </div>

        <!-- Slideshow -->
        <div class="slideshow-container" id="slideshowContainer">
            <div class="slideshow-track" id="slideshowTrack"></div>
            <button class="slide-nav left" onclick="moveSlide(-1)">‹</button>
            <button class="slide-nav right" onclick="moveSlide(1)">›</button>
        </div>

        <!-- Grid -->
        <div class="pokemon-grid" id="pokemonGrid" style="display:grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap:1rem;"></div>
    </div>

    <script src="js/main.js"></script>
    <script src="js/pokemon.js"></script>
</body>
</html>
