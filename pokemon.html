<script src="js/main.js"></script>
<script>
    let allPokemon = [];
    let currentSlide = 0;
    const visibleSlides = 4;

    async function loadPokemon() {
        try {
            const res = await fetch('/api/pokemon-all');
            const data = await res.json();

            if (data.error) {
                document.getElementById('pokemonGrid').innerHTML = `<p style="color:var(--danger);">${data.message || data.error}</p>`;
                return;
            }

            allPokemon = Array.isArray(data) ? data : [];
            if (!allPokemon.length) {
                document.getElementById('pokemonGrid').innerHTML = '<p style="color:var(--text2);">No Pokémon found.</p>';
                return;
            }

            renderSlideshow(allPokemon.slice(0, 20));
            filterPokemon();
        } catch (e) {
            document.getElementById('pokemonGrid').innerHTML = `<p style="color:var(--danger);">Failed to load. ${e.message}</p>`;
        }
    }
    // ... rest of the functions as before
    loadPokemon();
</script>
