<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokémon | SABAODY BOT</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav>
        <div class="logo">⚓ SABAODY BOT</div>
        <ul>
            <li><a href="/profile.html">Profile</a></li>
            <li><a href="/cards.html">Cards</a></li>
            <li><a href="/marketplace.html">Market</a></li>
            <li><a href="/store.html">Store</a></li>
            <li><a href="/pokemon.html" class="active">Pokémon</a></li>
            <li><a href="/leaderboard.html">Leaderboard</a></li>
        </ul>
    </nav>

    <div class="container">
        <h2 style="color:var(--gold);">🐾 Grand Line Pokémon</h2>
        <input type="text" class="search-box" id="pokeSearch" placeholder="Search by name or owner..." onkeyup="filterPokemon()">
        <div class="filters">
            <select id="rarityFilter" onchange="filterPokemon()">
                <option value="">All Rarities</option>
                <option value="Common">Common</option>
                <option value="Uncommon">Uncommon</option>
                <option value="Rare">Rare</option>
                <option value="Epic">Epic</option>
                <option value="Legendary">Legendary</option>
            </select>
        </div>

        <!-- Slideshow -->
        <div class="slideshow-container" id="slideshowContainer">
            <div class="slideshow-track" id="slideshowTrack"></div>
            <button class="slide-nav left" onclick="moveSlide(-1)">‹</button>
            <button class="slide-nav right" onclick="moveSlide(1)">›</button>
        </div>

        <!-- Grid -->
        <div id="pokemonGrid" style="display:grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap:1rem;"></div>
    </div>

    <script src="js/main.js"></script>
    <script>
        let allPokemon = [];
        let currentSlide = 0;
        const visibleSlides = 4;

        async function loadPokemon() {
            try {
                const res = await fetch('/api/pokemon-all');
                const data = await res.json();
                if (data.error) {
                    document.getElementById('pokemonGrid').innerHTML = `<p style="color:var(--danger);">${data.message || data.error}</p>`;
                    return;
                }
                allPokemon = Array.isArray(data) ? data : [];
                if (!allPokemon.length) {
                    document.getElementById('pokemonGrid').innerHTML = '<p style="color:var(--text2);">No Pokémon found.</p>';
                    return;
                }
                renderSlideshow(allPokemon.slice(0, 20));
                filterPokemon();
            } catch (e) {
                document.getElementById('pokemonGrid').innerHTML = `<p style="color:var(--danger);">Failed to load. ${e.message}</p>`;
            }
        }

        function renderSlideshow(list) {
            const track = document.getElementById('slideshowTrack');
            track.innerHTML = list.map(p => `
                <div class="slide-card">
                    <img src="${getSpriteUrl(p.pokemon_name)}" onerror="this.src='${getAvatarUrl(p.pokemon_name, 120)}'">
                    <div style="font-weight:bold;">${p.pokemon_name}</div>
                    <div style="color:var(--gold);">Lv.${p.level} | ${p.rarity}</div>
                    <div style="font-size:0.8rem;color:var(--text2);">Owner: ${p.owner_name || 'Wild'}</div>
                </div>
            `).join('');
            currentSlide = 0;
            updateSlidePosition();
        }

        function moveSlide(dir) {
            const maxSlides = Math.ceil(allPokemon.slice(0, 20).length / visibleSlides);
            currentSlide = Math.min(Math.max(currentSlide + dir, 0), maxSlides - 1);
            updateSlidePosition();
        }

        function updateSlidePosition() {
            const track = document.getElementById('slideshowTrack');
            const cardWidth = 200 + 16;
            track.style.transform = `translateX(-${currentSlide * visibleSlides * cardWidth}px)`;
        }

        function getSpriteUrl(name) {
            const dex = { Pikachu: 25, Charmander: 4, Squirtle: 7, Bulbasaur: 1, Eevee: 133, Gyarados: 130, Mewtwo: 150, Mew: 151 };
            const id = dex[name] || 1;
            return `https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/${id}.png`;
        }

        function filterPokemon() {
            const search = document.getElementById('pokeSearch').value.toLowerCase();
            const rarity = document.getElementById('rarityFilter').value;
            let filtered = allPokemon.filter(p =>
                (p.pokemon_name.toLowerCase().includes(search) ||
                 (p.owner_name && p.owner_name.toLowerCase().includes(search))) &&
                (!rarity || p.rarity === rarity)
            );
            const grid = document.getElementById('pokemonGrid');
            grid.innerHTML = filtered.map(p => `
                <div class="pokemon-card">
                    <img src="${getSpriteUrl(p.pokemon_name)}" onerror="this.src='${getAvatarUrl(p.pokemon_name, 100)}'">
                    <div class="pokemon-name">${p.pokemon_name}</div>
                    <div class="pokemon-level">Lv. ${p.level} | ${p.rarity}</div>
                    <div style="font-size:0.8rem;color:var(--text2);">Owner: ${p.owner_name || 'Wild'}</div>
                </div>
            `).join('');
        }

        loadPokemon();
    </script>
</body>
</html>
