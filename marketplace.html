<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card Market | SABAODY BOT</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav>
        <div class="logo">⚓ SABAODY BOT</div>
        <ul>
            <li><a href="/profile.html">Profile</a></li>
            <li><a href="/cards.html">Cards</a></li>
            <li><a href="/marketplace.html" class="active">Market</a></li>
            <li><a href="/store.html">Store</a></li>
            <li><a href="/pokemon.html">Pokémon</a></li>
            <li><a href="/leaderboard.html">Leaderboard</a></li>
        </ul>
    </nav>

    <div class="container">
        <h2 style="color:var(--gold);">🛒 Card Marketplace</h2>
        <div class="card-grid" id="marketListings"></div>
    </div>

    <script src="js/main.js"></script>
    <script>
        async function loadMarket() {
            try {
                const listings = await fetch('/api/marketplace').then(r => r.json());
                const grid = document.getElementById('marketListings');
                if (!listings.length) {
                    grid.innerHTML = '<p style="color:var(--text2);">No cards for sale. List a card with .mc in the bot!</p>';
                    return;
                }
                grid.innerHTML = listings.map(l => {
                    const timeLeft = l.expires_at ? Math.max(0, Math.ceil((new Date(l.expires_at) - Date.now()) / 3600000)) + 'h' : '?';
                    return `
                    <div class="card">
                        <img src="${l.image_url || getAvatarUrl(l.card_name, 256)}" onerror="this.src='${getAvatarUrl(l.card_name, 256)}'">
                        <div class="card-body">
                            <div class="card-title">${l.card_name}</div>
                            <span class="card-rarity rarity-t${l.rarity?.replace('t','')}">${l.rarity?.toUpperCase()}</span>
                            <div>💰 ${formatNumber(l.price)}฿ | ⏳ ${timeLeft}</div>
                            <div style="font-size:0.75rem;color:var(--text2);">Seller: ${l.seller_name}</div>
                            <button class="btn" style="margin-top:0.5rem;" onclick="buyCard(${l.id})">🛒 Buy</button>
                        </div>
                    </div>`;
                }).join('');
            } catch (e) {
                document.getElementById('marketListings').innerHTML = `<p style="color:var(--danger);">Failed to load market. ${e.message}</p>`;
            }
        }

        async function buyCard(listingId) {
            const userId = getSavedUserId();
            if (!userId) return alert('Please login first (Profile page)');
            try {
                const res = await fetch('/api/purchase', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ userId, type: 'card', id: listingId })
                });
                const data = await res.json();
                alert(data.message || data.error);
                loadMarket();
            } catch (e) { alert('Purchase failed'); }
        }

        loadMarket();
    </script>
</body>
</html>
